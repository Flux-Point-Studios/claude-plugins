name: harness

# The repo gates itself with the same contract the plugin scaffolds into
# every other repo: scripts/harness.sh --full, exit 0 = green. CI runs the
# check, so "green" stops depending on anyone remembering to run it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: harness --full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Claude Code CLI (for plugin validate)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the Definition-of-Done harness
        run: bash scripts/harness.sh --full

  hygiene:
    name: executable bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A stripped exec bit is how a gate quietly stops being a gate; the
      # hooks invoke via bash so it cannot disarm them, but keep it honest.
      - name: Shell scripts are executable
        run: |
          missing=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then echo "not executable: $f"; missing=1; fi
          done < <(git ls-files '*.sh')
          exit $missing
